name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check domain and storage rules
        run: npm test
      - name: Install browser test driver
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Check phone and desktop workflows
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/ui.cjs
      - name: Save interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-previews
          path: /tmp/tournament-*.png
          if-no-files-found: ignore
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p public
          cp index.html app.js engine.js storage.js style.css sw.js icon.svg manifest.webmanifest public/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
