name: Build Android APK and publish release
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle current app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html app.js live-share.js screen-views.js engine.js storage.js i18n.js trf.js apk-core.js mobile.css sw.js icon.svg manifest.webmanifest android/app/src/main/assets/
          cp -r assets android/app/src/main/assets/assets
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk tournament-3.4.12.apk
          gh release create v3.4.12-android tournament-3.4.12.apk --target "$GITHUB_SHA" --title 'Шахові турніри — Android 3.4.12' --notes 'Перша Android-збірка, підписана ключем розробки. Безкоштовний Android-застосунок українською та англійською. Турніри, гравці, результати й таблиця місць працюють без інтернету. Публікація для батьків і хмарні копії потребують інтернету. Дані браузерної версії можна перенести через резервну копію. Сайт: https://damidola.github.io/tournament/'
